name: Bug report
description: Something in the tool, the checker, exports or the skill does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or MCP call you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, and if possible a minimal HTML fixture or a public URL. Do not paste tokens, passwords or private pages.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit or release, Node version, Playwright version, operating system or Docker.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant part of the check report or log (`--json` helps).
      render: text
