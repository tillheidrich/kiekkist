<style>
  html, body { margin: 0; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: var(--c-sheet); color: var(--c-ink); font-family: var(--font-sans); padding: 24px; box-sizing: border-box; }
  .sheet { height: 100%; border: 2px solid var(--c-ink); display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; padding: 22px 32px; border-bottom: 1px solid var(--c-ink); font-family: var(--font-mono); font-size: 20px; color: var(--c-ink-2); text-transform: uppercase; letter-spacing: .06em; }
  .big { padding: 40px 32px 0; }
  .big .n { font-family: var(--font-mono); font-weight: 500; font-size: 250px; letter-spacing: -.06em; line-height: 1; display: inline-block; background: var(--c-signal); padding: 0 16px; }
  h1 { font-size: 124px; font-weight: 850; font-stretch: 66%; text-transform: uppercase; line-height: .9; margin: 40px 0 0; }
  .draw { margin-top: auto; border-top: 1px solid var(--c-ink); background: var(--c-panel); padding: 20px 32px; }
  svg { display: block; width: 100%; color: var(--c-line); }
  .part { fill: var(--c-panel); stroke: var(--c-ink); stroke-width: 3; }
  .thin { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .axis { stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 24 6 4 6; }
  text { font-family: var(--font-mono); font-size: 22px; fill: currentColor; }
  .foot { display: flex; justify-content: space-between; padding: 20px 32px; border-top: 1px solid var(--c-ink); font-size: 26px; font-weight: 700; }
  .foot span:last-child { font-family: var(--font-mono); font-weight: 500; font-size: 22px; }
</style>
</head>
