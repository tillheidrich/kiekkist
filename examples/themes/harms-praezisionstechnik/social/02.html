<!doctype html>
<html lang="de" data-size="1200x630">
<head>
<meta name="kk:size" content="1200x630">
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Link-Vorschau: Harms Präzisionstechnik</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--c-steel); color: var(--c-sheet); font-family: var(--font-sans); padding: 20px; box-sizing: border-box; }
  .sheet { height: 100%; border: 1.5px solid oklch(60% 0.015 245); display: grid; grid-template-columns: 1fr 380px; }
  .l { padding: 40px 44px; display: flex; flex-direction: column; border-right: 1px solid oklch(45% 0.015 245); }
  .lbl { font-family: var(--font-mono); font-size: 16px; letter-spacing: .06em; text-transform: uppercase; color: oklch(80% 0.01 245); }
  h1 { font-size: 92px; font-weight: 850; font-stretch: 64%; line-height: .88; text-transform: uppercase; margin: auto 0 0; }
  h1 span { white-space: nowrap; color: var(--c-ink); background: var(--c-signal); padding: 0 8px; text-transform: none; }
  .r { display: grid; grid-template-rows: repeat(4, 1fr); }
  .r div { border-bottom: 1px solid oklch(45% 0.015 245); padding: 16px 28px; display: flex; flex-direction: column; justify-content: center; }
  .r div:last-child { border-bottom: 0; }
  .v { font-family: var(--font-mono); font-size: 36px; color: var(--c-signal); letter-spacing: -.02em; }
</style>
</head>
<body>
<main class="sheet">
  <div class="l"><p class="lbl">Harms Präzisionstechnik · Hamburg-Harburg</p><h1>Drehteile und Frästeile auf <span>±2 µm</span></h1></div>
  <div class="r">
    <div><span class="lbl">Losgröße</span><span class="v">1 bis 5.000</span></div>
    <div><span class="lbl">Erstmuster</span><span class="v">8 AT</span></div>
    <div><span class="lbl">Angebot</span><span class="v">48 h</span></div>
    <div><span class="lbl">Zertifikate</span><span class="v" style="font-size:28px">ISO 9001 · 13485</span></div>
  </div>
</main>
</body>
</html>
