<!doctype html>
<html lang="de" data-size="1200x630">
<head>
<meta name="kk:size" content="1200x630">
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Link-Vorschau: Brandt Weller</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--c-paper); color: var(--c-ink); font-family: var(--font-serif); }
  .card { height: 630px; box-sizing: border-box; padding: 56px 72px; display: grid; grid-template-columns: 220px 1fr; column-gap: 56px; grid-template-rows: 1fr auto; border-top: 14px solid var(--c-green); }
  .margin { font-family: var(--font-sans); font-size: 17px; color: var(--c-ink-2); line-height: 1.5; padding-top: 10px; }
  .margin b { display: block; color: var(--c-green); font-weight: 650; letter-spacing: .12em; text-transform: uppercase; font-size: 14px; margin-bottom: 8px; }
  h1 { font-size: 66px; line-height: 1.05; font-weight: 420; letter-spacing: -.012em; margin: 0; font-variation-settings: "opsz" 60; }
  .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--c-ink); padding-top: 16px; }
  .foot b { font-size: 30px; font-weight: 600; }
  .foot span { font-family: var(--font-sans); font-size: 18px; color: var(--c-ink-2); }
</style>
</head>
<body>
<main class="card">
  <div class="margin"><b>Rechtsanwälte · Steuerberater</b>Hamburg, für Familienunternehmen mit 20 bis 500 Beschäftigten</div>
  <h1>Wir beraten Familien&shy;unternehmen, bevor es streitig wird.</h1>
  <div class="foot"><b>Brandt Weller</b><span>Ferdinandstraße 29 · Hamburg</span></div>
</main>
</body>
</html>
