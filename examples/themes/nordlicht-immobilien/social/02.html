<!doctype html>
<html lang="de" data-size="1200x630">
<head>
<meta name="kk:size" content="1200x630">
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Link-Vorschau: Nordlicht Immobilien</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--c-deep); color: var(--c-on-deep); font-family: var(--font-text); }
  .card { display: grid; grid-template-columns: 1fr 460px; height: 630px; }
  .txt { padding: 56px 64px; display: flex; flex-direction: column; }
  .brand { font-family: var(--font-display); font-size: 34px; font-weight: 500; }
  .brand span { display: block; font-family: var(--font-text); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: oklch(80% 0.012 240); margin-top: 6px; }
  h1 { font-family: var(--font-display); font-weight: 300; font-size: 76px; line-height: .98; letter-spacing: -.02em; margin: auto 0 0; }
  h1 em { font-style: italic; color: var(--c-brass); }
  p.meta { font-size: 18px; margin: 28px 0 0; border-top: 1px solid oklch(45% 0.03 245); padding-top: 18px; color: oklch(85% 0.01 240); }
  img { width: 460px; height: 630px; object-fit: cover; object-position: 30% 50%; display: block; }
</style>
</head>
<body>
<main class="card">
  <div class="txt">
    <p class="brand">Nordlicht<span>Immobilien in den Elbvororten</span></p>
    <h1>Häuser an der Elbe, <em>leise</em> verkauft.</h1>
    <p class="meta">Övelgönne bis Rissen · höchstens zwölf Objekte im Jahr</p>
  </div>
  <img src="../assets/img/elbe-hoch-700.jpg" alt="Elbe am Abend, Hafen und Stadt im Gegenlicht.">
</main>
</body>
</html>
