<!doctype html>
<html lang="de" data-size="1080x1350">
<head>
<meta name="kk:size" content="1080x1350">
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Social 4:5: Neu im Angebot · Nordlicht Immobilien</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  html, body { margin: 0; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: var(--c-paper); color: var(--c-ink); font-family: var(--font-text); }
  .card { height: 1350px; display: grid; grid-template-rows: 780px 1fr; }
  img { width: 100%; height: 780px; object-fit: cover; object-position: 60% 50%; display: block; }
  .txt { padding: 56px 72px 56px; display: flex; flex-direction: column; }
  .label { font-size: 20px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--c-brass-text); }
  h1 { font-family: var(--font-display); font-weight: 300; font-size: 96px; line-height: .95; letter-spacing: -.02em; margin: 24px 0 0; }
  h1 em { font-style: italic; }
  .sub { font-size: 28px; line-height: 1.4; margin: 24px 0 0; max-width: 820px; color: var(--c-ink-2); }
  .row { margin-top: auto; display: flex; justify-content: space-between; border-top: 1px solid var(--c-ink); padding-top: 22px; font-size: 26px; font-variant-numeric: tabular-nums; }
  .row b { font-weight: 600; }
  .credit { position: absolute; top: 740px; right: 24px; color: #fff; font-size: 16px; text-shadow: 0 1px 6px rgb(0 0 0 / .6); }
</style>
</head>
<body>
<main class="card">
  <img src="../assets/img/elbe-abend-1000.jpg" alt="Abendlicht über der Elbe in Hamburg.">
  <p class="credit">Platzhalter, nicht das Objekt · Foto: Till Heidrich</p>
  <div class="txt">
    <p class="label">Neu im Angebot · NL-2611</p>
    <h1>Kapitänshaus, <em>Blankenese</em></h1>
    <p class="sub">Gebaut 1912 für einen Elblotsen, 2019 saniert. Vom Wohnzimmer bis zum Fahrwasser.</p>
    <p class="row"><span>186 m² · 6 Zimmer · 742 m² Grund</span><b>2.450.000 €</b></p>
  </div>
</main>
</body>
</html>
