<!doctype html>
<html lang="de">
<head>
<meta name="kk:size" content="1920x1080">
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Folie: These · Studio Elbe</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  html, body { margin: 0; }
  body { width: 1920px; height: 1080px; overflow: hidden; background: var(--c-night); color: var(--c-bone); font-family: var(--font-sans); }
  .slide { display: grid; grid-template-columns: 1fr 620px; height: 1080px; }
  .l { padding: 88px 120px 72px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; font-size: 22px; color: var(--c-mute-dark); }
  .top b { font-family: var(--font-serif); font-weight: 400; font-size: 34px; color: var(--c-bone); }
  .top b em { font-style: italic; }
  h1 { font-family: var(--font-serif); font-weight: 330; font-size: 112px; line-height: 1; letter-spacing: -.03em; margin: auto 0 0; }
  h1 em { font-style: italic; color: var(--c-buoy-on-dark); }
  .foot { margin-top: 64px; display: flex; gap: 64px; border-top: 1px solid var(--c-line-dark); padding-top: 24px; font-size: 22px; color: var(--c-mute-dark); }
  .foot span:first-child { color: var(--c-bone); }
  .p { margin: 0; position: relative; }
  .p img { width: 100%; height: 100%; object-fit: cover; object-position: 58% 50%; display: block; }
  .p figcaption { position: absolute; left: 24px; bottom: 20px; font-size: 16px; color: var(--c-bone); background: oklch(19% 0.025 225 / .75); padding: 4px 10px; }
</style>
</head>
<body>
<main class="slide">
  <div class="l">
    <div class="top"><b>Studio <em>Elbe</em></b><span>Unternehmerfrühstück Stade · 20.11.2026</span></div>
    <h1>Die meisten Mittelständler haben kein Strategieproblem. Sie haben <em>zu viele</em> Prioritäten.</h1>
    <div class="foot"><span>Johanna Albers</span><span>Was wir in 40 Klausuren gelernt haben</span><span>1 / 18</span></div>
  </div>
  <figure class="p"><img src="../assets/img/stadersand-1200.jpg" alt="Hausboot am Stadersand von oben."><figcaption>Foto: Till Heidrich</figcaption></figure>
</main>
</body>
</html>
