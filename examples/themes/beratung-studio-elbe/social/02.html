<!doctype html>
<html lang="de" data-size="1200x630">
<head>
<meta name="kk:size" content="1200x630">
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Link-Vorschau: Studio Elbe</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--c-white); color: var(--c-ink); font-family: var(--font-sans); }
  .card { display: grid; grid-template-columns: 1fr 470px; height: 630px; }
  .l { padding: 52px 60px 48px; display: flex; flex-direction: column; }
  .brand { font-family: var(--font-serif); font-size: 32px; }
  .brand em { font-style: italic; }
  h1 { font-family: var(--font-serif); font-weight: 340; font-size: 64px; line-height: 1.02; letter-spacing: -.025em; margin: auto 0 0; }
  h1 em { font-style: italic; color: var(--c-buoy); }
  .meta { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--c-ink); font-size: 18px; color: var(--c-mute-light); display: flex; justify-content: space-between; }
  img { width: 470px; height: 630px; object-fit: cover; object-position: 62% 50%; display: block; }
</style>
</head>
<body>
<main class="card">
  <div class="l">
    <p class="brand" style="margin:0">Studio <em>Elbe</em></p>
    <h1>Kein Strategieproblem. <em>Zu viele</em> Prioritäten.</h1>
    <p class="meta"><span>Strategieberatung für den Mittelstand</span><span>Stade · Elbe-km 654</span></p>
  </div>
  <img src="../assets/img/stadersand-1200.jpg" alt="Hausboot am Stadersand von oben, Foto Till Heidrich.">
</main>
</body>
</html>
